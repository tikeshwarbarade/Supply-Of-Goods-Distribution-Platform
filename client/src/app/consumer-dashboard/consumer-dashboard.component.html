<main class="consumer-page">
  <section class="role-card">

    <span class="role-pill">CONSUMER PORTAL</span>

    <h2>Consumer Dashboard</h2>
    <p>Browse wholesaler inventory, place orders, track delivery, and submit feedback.</p>

    <div class="stats-grid">
      <article class="stat-card">
        <span>Available Inventory</span>
        <strong>{{ inventories.length }}</strong>
      </article>

      <article class="stat-card">
        <span>My Orders</span>
        <strong>{{ orders.length }}</strong>
      </article>

      <article class="stat-card">
        <span>Pending Orders</span>
        <strong>{{ pendingOrders }}</strong>
      </article>

      <article class="stat-card">
        <span>Delivered Orders</span>
        <strong>{{ deliveredOrders }}</strong>
      </article>
    </div>

    <div class="actions">
      <button type="button" (click)="goToPlaceOrder()">
        Place Order
      </button>

      <button type="button" (click)="goToOrders()">
        View Orders / Feedback
      </button>

      <button type="button" class="logout" (click)="logout()">
        Logout
      </button>
    </div>

  </section>
</main>
