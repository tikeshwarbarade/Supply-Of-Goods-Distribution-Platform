<div class="simple-role-dashboard">
  <div class="role-card">
    <h2>Consumer Dashboard</h2>
    <p>Browse products, place orders, and track order history.</p>

    <button type="button" (click)="goToPlaceOrder()">
      Place Order
    </button>

    <button type="button" (click)="goToOrders()">
      View Orders

      Logout
    </button>
  </div>
</div>
